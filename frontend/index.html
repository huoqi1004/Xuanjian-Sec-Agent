<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>玄鉴安全智能体 - 多引擎协同安全评估系统</title>
    <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css">
    <style>
        /* ============================================
           GLOBAL STYLES
           ============================================ */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; }
        body {
            font-family: 'Microsoft YaHei', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0a0a1a;
            color: #e0e0e0;
        }
        #app { height: 100%; }

        /* ============================================
           ELEMENT PLUS DARK OVERRIDES
           ============================================ */
        .el-menu { border-right: none !important; }
        .el-table { --el-table-bg-color: rgba(22, 33, 62, 0.6) !important; --el-table-tr-bg-color: rgba(22, 33, 62, 0.6) !important; --el-table-header-bg-color: rgba(26, 26, 46, 0.8) !important; --el-table-row-hover-bg-color: rgba(0, 212, 255, 0.05) !important; --el-table-border-color: rgba(0, 212, 255, 0.1) !important; --el-table-text-color: #c0c0c0 !important; --el-table-header-text-color: #00d4ff !important; }
        .el-table th.el-table__cell { font-weight: 600; }
        .el-card { --el-card-bg-color: rgba(22, 33, 62, 0.7) !important; --el-card-border-color: rgba(0, 212, 255, 0.15) !important; border-radius: 12px !important; }
        .el-dialog { --el-dialog-bg-color: #16213e !important; border: 1px solid rgba(0, 212, 255, 0.2) !important; border-radius: 12px !important; }
        .el-dialog__header { border-bottom: 1px solid rgba(0, 212, 255, 0.1); }
        .el-dialog__title { color: #00d4ff !important; }
        .el-form-item__label { color: rgba(255, 255, 255, 0.7) !important; }
        .el-input__wrapper, .el-textarea__inner, .el-select__wrapper { background: rgba(10, 10, 26, 0.6) !important; border: 1px solid rgba(0, 212, 255, 0.15) !important; box-shadow: none !important; color: #e0e0e0 !important; }
        .el-input__wrapper:hover, .el-textarea__inner:hover, .el-select__wrapper:hover { border-color: rgba(0, 212, 255, 0.3) !important; }
        .el-input__wrapper.is-focus, .el-textarea__inner:focus { border-color: #00d4ff !important; box-shadow: 0 0 10px rgba(0, 212, 255, 0.1) !important; }
        .el-input__inner, .el-textarea__inner { color: #e0e0e0 !important; }
        .el-input__inner::placeholder, .el-textarea__inner::placeholder { color: rgba(255, 255, 255, 0.3) !important; }
        .el-select-dropdown { background: #16213e !important; border: 1px solid rgba(0, 212, 255, 0.2) !important; }
        .el-select-dropdown__item { color: #c0c0c0 !important; }
        .el-select-dropdown__item.is-hovering { background: rgba(0, 212, 255, 0.1) !important; }
        .el-select-dropdown__item.is-selected { color: #00d4ff !important; }
        .el-pagination { --el-pagination-bg-color: transparent !important; --el-pagination-text-color: #c0c0c0 !important; --el-pagination-button-bg-color: rgba(22, 33, 62, 0.6) !important; --el-pagination-hover-color: #00d4ff !important; }
        .el-pager li { background: rgba(22, 33, 62, 0.6) !important; color: #c0c0c0 !important; }
        .el-pager li.is-active { background: #00d4ff !important; color: #0a0a1a !important; }
        .el-button--primary { --el-button-bg-color: #00d4ff !important; --el-button-border-color: #00d4ff !important; --el-button-text-color: #0a0a1a !important; --el-button-hover-bg-color: #33dfff !important; --el-button-hover-border-color: #33dfff !important; }
        .el-button--danger { --el-button-bg-color: #f56c6c !important; --el-button-border-color: #f56c6c !important; }
        .el-button--success { --el-button-bg-color: #67c23a !important; --el-button-border-color: #67c23a !important; }
        .el-button--warning { --el-button-bg-color: #e6a23c !important; --el-button-border-color: #e6a23c !important; }
        .el-button--info { --el-button-bg-color: rgba(255,255,255,0.1) !important; --el-button-border-color: rgba(255,255,255,0.2) !important; --el-button-text-color: #c0c0c0 !important; }
        .el-tag { border: none !important; }
        .el-tabs__item { color: rgba(255, 255, 255, 0.5) !important; }
        .el-tabs__item.is-active { color: #00d4ff !important; }
        .el-tabs__active-bar { background-color: #00d4ff !important; }
        .el-tabs__nav-wrap::after { background-color: rgba(0, 212, 255, 0.1) !important; }
        .el-switch.is-checked .el-switch__core { background-color: #00d4ff !important; border-color: #00d4ff !important; }
        .el-message-box { background: #16213e !important; border: 1px solid rgba(0, 212, 255, 0.2) !important; }
        .el-message-box__title { color: #00d4ff !important; }
        .el-message-box__message p { color: #c0c0c0 !important; }
        .el-descriptions__label { color: rgba(255, 255, 255, 0.6) !important; background: rgba(10, 10, 26, 0.4) !important; }
        .el-descriptions__content { color: #e0e0e0 !important; background: rgba(22, 33, 62, 0.4) !important; }
        .el-descriptions__cell { border-color: rgba(0, 212, 255, 0.08) !important; }
        .el-radio__label { color: #c0c0c0 !important; }
        .el-checkbox__label { color: #c0c0c0 !important; }
        .el-checkbox__inner { background: rgba(10, 10, 26, 0.6) !important; border-color: rgba(0, 212, 255, 0.3) !important; }
        .el-checkbox__input.is-checked .el-checkbox__inner { background: #00d4ff !important; border-color: #00d4ff !important; }
        .el-radio__inner { background: rgba(10, 10, 26, 0.6) !important; border-color: rgba(0, 212, 255, 0.3) !important; }
        .el-radio__input.is-checked .el-radio__inner { background: #00d4ff !important; border-color: #00d4ff !important; }
        .el-input-number__decrease, .el-input-number__increase { background: rgba(22, 33, 62, 0.8) !important; border-color: rgba(0, 212, 255, 0.15) !important; color: #c0c0c0 !important; }
        .el-progress-bar__outer { background: rgba(0, 212, 255, 0.1) !important; }
        .el-upload-dragger { background: rgba(10, 10, 26, 0.6) !important; border: 2px dashed rgba(0, 212, 255, 0.2) !important; }
        .el-upload-dragger:hover { border-color: #00d4ff !important; }
        .el-drawer { background: #16213e !important; }
        .el-drawer__header { color: #00d4ff !important; border-bottom: 1px solid rgba(0, 212, 255, 0.1); margin-bottom: 0; padding-bottom: 16px; }
        .el-notification { background: #16213e !important; border: 1px solid rgba(0, 212, 255, 0.2) !important; }
        .el-notification__title { color: #00d4ff !important; }
        .el-notification__content p { color: #c0c0c0 !important; }

        /* ============================================
           LAYOUT
           ============================================ */
        .app-layout {
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 240px;
            min-width: 240px;
            height: 100vh;
            background: #16213e;
            border-right: 1px solid rgba(0, 212, 255, 0.1);
            display: flex;
            flex-direction: column;
            transition: all 0.3s ease;
            position: relative;
            z-index: 100;
        }
        .sidebar.collapsed { width: 64px; min-width: 64px; }
        .sidebar.collapsed .sidebar-logo span,
        .sidebar.collapsed .menu-text,
        .sidebar.collapsed .el-menu-item [class^="el-icon"],
        .sidebar.collapsed .el-sub-menu__title span { display: none; }
        .sidebar.collapsed .el-menu-item,
        .sidebar.collapsed .el-sub-menu__title { justify-content: center; padding: 0 !important; }

        .sidebar-logo {
            height: 64px;
            display: flex;
            align-items: center;
            padding: 0 16px;
            border-bottom: 1px solid rgba(0, 212, 255, 0.1);
            gap: 10px;
            flex-shrink: 0;
        }
        .sidebar-logo .logo-icon {
            width: 36px;
            height: 36px;
            flex-shrink: 0;
        }
        .sidebar-logo span {
            font-size: 16px;
            font-weight: 700;
            background: linear-gradient(135deg, #00d4ff, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            white-space: nowrap;
        }

        .sidebar-menu {
            flex: 1;
            overflow-y: auto;
            padding: 8px 0;
        }
        .sidebar-menu::-webkit-scrollbar { width: 4px; }
        .sidebar-menu::-webkit-scrollbar-thumb { background: rgba(0, 212, 255, 0.2); border-radius: 2px; }

        .el-menu {
            background: transparent !important;
        }
        .el-menu-item, .el-sub-menu__title {
            color: rgba(255, 255, 255, 0.6) !important;
            height: 44px !important;
            line-height: 44px !important;
            margin: 2px 8px;
            border-radius: 8px !important;
            transition: all 0.3s ease;
        }
        .el-menu-item:hover, .el-sub-menu__title:hover {
            background: rgba(0, 212, 255, 0.08) !important;
            color: #00d4ff !important;
        }
        .el-menu-item.is-active {
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.15), rgba(124, 58, 237, 0.1)) !important;
            color: #00d4ff !important;
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.1);
        }
        .el-menu-item .el-icon, .el-sub-menu__title .el-icon {
            color: inherit !important;
            font-size: 18px;
        }

        /* Main content area */
        .main-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: #0a0a1a;
        }

        /* Top header */
        .top-header {
            height: 64px;
            background: rgba(22, 33, 62, 0.9);
            border-bottom: 1px solid rgba(0, 212, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            flex-shrink: 0;
            backdrop-filter: blur(10px);
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .collapse-btn {
            cursor: pointer;
            color: rgba(255, 255, 255, 0.6);
            font-size: 20px;
            transition: color 0.3s;
            background: none;
            border: none;
            padding: 4px;
        }
        .collapse-btn:hover { color: #00d4ff; }
        .breadcrumb-area {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.5);
        }
        .breadcrumb-area .current { color: #00d4ff; }

        .header-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .notification-btn {
            position: relative;
            cursor: pointer;
            color: rgba(255, 255, 255, 0.6);
            font-size: 20px;
            transition: color 0.3s;
            background: none;
            border: none;
            padding: 4px;
        }
        .notification-btn:hover { color: #00d4ff; }
        .notification-badge {
            position: absolute;
            top: -4px;
            right: -4px;
            width: 16px;
            height: 16px;
            background: #f56c6c;
            border-radius: 50%;
            font-size: 10px;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            padding: 4px 12px;
            border-radius: 20px;
            transition: background 0.3s;
        }
        .user-info:hover { background: rgba(0, 212, 255, 0.1); }
        .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00d4ff, #7c3aed);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 600;
            color: white;
        }
        .user-name { font-size: 14px; color: rgba(255, 255, 255, 0.8); }
        .user-role { font-size: 11px; color: rgba(255, 255, 255, 0.4); }

        /* Content area */
        .content-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: linear-gradient(180deg, #0a0a1a 0%, #0d0d20 100%);
        }
        .content-area::-webkit-scrollbar { width: 6px; }
        .content-area::-webkit-scrollbar-thumb { background: rgba(0, 212, 255, 0.2); border-radius: 3px; }
        .content-area::-webkit-scrollbar-track { background: transparent; }

        /* ============================================
           COMMON COMPONENTS
           ============================================ */
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .page-title {
            font-size: 22px;
            font-weight: 600;
            color: #fff;
        }
        .page-desc {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.4);
            margin-top: 4px;
        }

        .stat-card {
            background: rgba(22, 33, 62, 0.7);
            border: 1px solid rgba(0, 212, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        .stat-card:hover {
            border-color: rgba(0, 212, 255, 0.3);
            box-shadow: 0 4px 20px rgba(0, 212, 255, 0.1);
            transform: translateY(-2px);
        }
        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
        }
        .stat-card.cyan::before { background: linear-gradient(90deg, #00d4ff, transparent); }
        .stat-card.purple::before { background: linear-gradient(90deg, #7c3aed, transparent); }
        .stat-card.green::before { background: linear-gradient(90deg, #67c23a, transparent); }
        .stat-card.orange::before { background: linear-gradient(90deg, #e6a23c, transparent); }
        .stat-card.red::before { background: linear-gradient(90deg, #f56c6c, transparent); }

        .stat-label {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 8px;
        }
        .stat-value {
            font-size: 32px;
            font-weight: 700;
            line-height: 1;
        }
        .stat-value.cyan { color: #00d4ff; }
        .stat-value.purple { color: #7c3aed; }
        .stat-value.green { color: #67c23a; }
        .stat-value.orange { color: #e6a23c; }
        .stat-value.red { color: #f56c6c; }
        .stat-value.white { color: #fff; }
        .stat-suffix {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.4);
            margin-left: 4px;
        }
        .stat-trend {
            font-size: 12px;
            margin-top: 8px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .stat-trend.up { color: #f56c6c; }
        .stat-trend.down { color: #67c23a; }

        .chart-card {
            background: rgba(22, 33, 62, 0.7);
            border: 1px solid rgba(0, 212, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .chart-card-title {
            font-size: 15px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .chart-card-title::before {
            content: '';
            width: 3px;
            height: 16px;
            background: #00d4ff;
            border-radius: 2px;
        }
        .chart-container {
            width: 100%;
            height: 300px;
        }

        /* AI Assistant Page */
        .assistant-page {
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }
        .assistant-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(22, 33, 62, 0.7);
            border: 1px solid rgba(0, 212, 255, 0.1);
            border-radius: 12px;
            overflow: hidden;
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .chat-messages::-webkit-scrollbar { width: 6px; }
        .chat-messages::-webkit-scrollbar-thumb { background: rgba(0, 212, 255, 0.2); border-radius: 3px; }
        .chat-messages::-webkit-scrollbar-track { background: transparent; }
        
        .message {
            display: flex;
            gap: 12px;
            max-width: 85%;
        }
        .user-message {
            align-self: flex-end;
            flex-direction: row-reverse;
        }
        .assistant-message {
            align-self: flex-start;
        }
        .message-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(0, 212, 255, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #00d4ff;
            flex-shrink: 0;
        }
        .user-message .message-avatar {
            background: rgba(124, 58, 237, 0.15);
            color: #7c3aed;
        }
        .message-content {
            flex: 1;
        }
        .message-bubble {
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.6;
            word-wrap: break-word;
        }
        .assistant-message .message-bubble {
            background: rgba(22, 33, 62, 0.9);
            border: 1px solid rgba(0, 212, 255, 0.15);
            color: #e0e0e0;
        }
        .user-message .message-bubble {
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.2), rgba(124, 58, 237, 0.15));
            border: 1px solid rgba(0, 212, 255, 0.2);
            color: #fff;
        }
        .message-bubble.loading {
            display: flex;
            gap: 4px;
            align-items: center;
        }
        .loading-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #00d4ff;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .loading-dot:nth-child(1) { animation-delay: -0.32s; }
        .loading-dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
        
        .chat-input {
            padding: 16px;
            background: rgba(22, 33, 62, 0.9);
            border-top: 1px solid rgba(0, 212, 255, 0.1);
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }
        .chat-input .el-textarea {
            flex: 1;
        }
        .chat-input .el-textarea .el-textarea__inner {
            background: rgba(10, 10, 26, 0.6) !important;
            border: 1px solid rgba(0, 212, 255, 0.15) !important;
            color: #e0e0e0;
            resize: none;
        }

        .action-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 6px;
        }
        .status-dot.online { background: #67c23a; box-shadow: 0 0 6px #67c23a; }
        .status-dot.offline { background: #909399; }

        .glow-border {
            border: 1px solid rgba(0, 212, 255, 0.2);
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.05);
        }

        /* Upload area */
        .upload-area {
            border: 2px dashed rgba(0, 212, 255, 0.2);
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            background: rgba(10, 10, 26, 0.4);
            transition: all 0.3s;
            cursor: pointer;
        }
        .upload-area:hover {
            border-color: #00d4ff;
            background: rgba(0, 212, 255, 0.03);
        }
        .upload-icon { font-size: 48px; color: rgba(0, 212, 255, 0.4); margin-bottom: 12px; }
        .upload-text { color: rgba(255, 255, 255, 0.5); font-size: 14px; }
        .upload-hint { color: rgba(255, 255, 255, 0.3); font-size: 12px; margin-top: 8px; }

        /* Result card */
        .result-card {
            background: rgba(22, 33, 62, 0.7);
            border: 1px solid rgba(0, 212, 255, 0.1);
            border-radius: 12px;
            padding: 24px;
            margin-top: 20px;
        }
        .result-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }
        .result-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }
        .result-icon.malicious { background: rgba(245, 108, 108, 0.15); color: #f56c6c; }
        .result-icon.benign { background: rgba(103, 194, 58, 0.15); color: #67c23a; }
        .result-icon.suspicious { background: rgba(230, 162, 60, 0.15); color: #e6a23c; }

        /* Confidence bar */
        .confidence-bar {
            height: 8px;
            background: rgba(0, 212, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 8px;
        }
        .confidence-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 1s ease;
        }

        /* Quick actions */
        .quick-actions {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
        }
        .quick-action-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            padding: 16px;
            background: rgba(22, 33, 62, 0.5);
            border: 1px solid rgba(0, 212, 255, 0.1);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            color: rgba(255, 255, 255, 0.7);
            font-size: 13px;
        }
        .quick-action-btn:hover {
            border-color: rgba(0, 212, 255, 0.3);
            background: rgba(0, 212, 255, 0.05);
            transform: translateY(-2px);
            color: #00d4ff;
        }
        .quick-action-btn .icon { font-size: 24px; }

        /* Device status indicator */
        .device-status {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .device-status .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }
        .device-status .dot.online {
            background: #67c23a;
            box-shadow: 0 0 6px rgba(103, 194, 58, 0.6);
            animation: pulse-dot 2s infinite;
        }
        .device-status .dot.offline { background: #909399; }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

    // ============================================
    // API SERVICE
    // ============================================
    const API_BASE = 'http://localhost:3000/api';
    const MESSAGE_DEBOUNCE = {};
    let messageGroupCount = 0;
    let lastMessageTime = 0;

    function getToken() {
        return localStorage.getItem('xuanjian_token') || '';
    }

    function getAuthHeader() {
        return { 'Authorization': 'Bearer ' + getToken() };
    }

    function showMessage(type, msg) {
        const now = Date.now();
        const key = type + ':' + msg;
        
        if (MESSAGE_DEBOUNCE[key] && now - MESSAGE_DEBOUNCE[key] < 3000) {
            return;
        }
        
        if (now - lastMessageTime < 500) {
            messageGroupCount++;
            if (messageGroupCount > 5) {
                return;
            }
        } else {
            messageGroupCount = 0;
        }
        
        MESSAGE_DEBOUNCE[key] = now;
        lastMessageTime = now;
        
        if (type === 'error') ElementPlus.ElMessage.error(msg);
        else if (type === 'warning') ElementPlus.ElMessage.warning(msg);
        else if (type === 'info') ElementPlus.ElMessage.info(msg);
        else ElementPlus.ElMessage.success(msg);
    }

    const api = {
        async request(method, url, data, options = {}) {
            const timeout = options.timeout || 30000;
            const config = {
                method,
                url: API_BASE + url,
                headers: { 'Authorization': 'Bearer ' + getToken(), 'Content-Type': 'application/json' },
                timeout: timeout
            };
            if (data) config.data = data;
            try {
                const resp = await axios(config);
                return resp.data;
            } catch (err) {
                if (err.response && err.response.status === 401) {
                    localStorage.removeItem('xuanjian_token');
                    window.location.href = 'login.html';
                    return;
                }
                throw err;
            }
        },
        get(url) { return this.request('GET', url); },
        post(url, data, options) { return this.request('POST', url, data, options); },
        put(url, data, options) { return this.request('PUT', url, data, options); },
        delete(url) { return this.request('DELETE', url); }
    };

    axios.interceptors.response.use(
        function(response) { return response; },
        function(error) {
            if (error.response) {
                const status = error.response.status;
                if (status === 401) {
                    localStorage.removeItem('xuanjian_token');
                    window.location.href = 'login.html';
                } else if (status === 403) {
                    showMessage('error', '权限不足，无法执行此操作');
                } else if (status === 429) {
                    showMessage('warning', '操作过于频繁，请稍后再试');
                } else if (status >= 500) {
                    showMessage('error', '服务器内部错误，请稍后重试');
                }
            } else if (error.code === 'ECONNABORTED') {
                showMessage('error', '请求超时，请检查网络连接');
            } else {
                showMessage('error', '网络连接失败，请检查网络');
            }
            return Promise.reject(error);
        }
    );

            function connectWebSocket() {
                const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                const wsUrl = protocol + '//' + window.location.hostname + ':3000/ws/frontend';
                try {
                    ws = new WebSocket(wsUrl);
                    ws.onopen = () => { wsConnected.value = true; };
                    ws.onmessage = (event) => {
                        try {
                            const msg = JSON.parse(event.data);
                            if (msg.type === 'scan_progress') {
                                const scanComp = app._instance?.proxy?.$refs?.scanPage;
                                if (scanComp && scanComp.updateProgress) scanComp.updateProgress(msg.data);
                            } else if (msg.type === 'new_alert') {
                                wsNotifications.value.unshift(msg.data);
                                ElementPlus.ElNotification({ title: '新告警', message: msg.data.description || '检测到新的安全告警', type: 'warning', duration: 5000 });
                            } else if (msg.type === 'scan_complete') {

                            }
                        } catch(e) {}
                    };
                    ws.onclose = () => { wsConnected.value = false; setTimeout(connectWebSocket, 5000); };

                if (!passwordForm.oldPassword || !passwordForm.newPassword || !passwordForm.confirmPassword) {

                    ElementPlus.ElMessage.warning('新密码至少6位'); return;
                }
                if (passwordForm.newPassword !== passwordForm.confirmPassword) {
                    ElementPlus.ElMessage.warning('两次密码输入不一致'); return;

                passwordLoading.value = true;

            <div class="chart-card" style="margin-bottom:20px;">

            <div v-if="checking" class="page-loading"><div style="text-align:center;"><el-icon :size="40" class="is-loading" style="color:#00d4ff;"><Loading /></el-icon><div style="margin-top:12px;">正在进行基线检查，请稍候...</div></div></div>
            <div v-if="showResults && !checking">
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px;">

    app.component('virus-page', defineComponent({
        setup() {
            const loading = ref(false);
            const uploading = ref(false);

                        }));

            async function handleUpload() {
                if (fileList.value.length === 0) { ElementPlus.ElMessage.warning('请先选择文件'); return; }
                uploading.value = true; detecting.value = true;
                detectResult.value = null; engineResults.value = [];

                // 重置引擎进度
                engineProgress.forEach(e => { e.status = 'scanning'; });

                try {
                    const formData = new FormData();
                    formData.append('file', fileList.value[0].raw);

                    const resp = await axios.post(API_BASE + '/virus/upload', formData, {
                        headers: { 'Authorization': 'Bearer ' + getToken() }
                    });

                    const res = resp.data;
                    if (res && res.code === 0) {
                        const d = res.data;

                        // 更新引擎结果
                        if (d.engines) {
                            const engineMap = { 'local_hash': 0, '360_ti': 1, 'kaspersky': 2, 'ai_malware': 3, 'ai_poisoning': 4 };
                            for (const [key, result] of Object.entries(d.engines)) {
                                const idx = engineMap[key];
                                if (idx !== undefined) {
                                    engineProgress[idx].status = result.status === 'completed' ? 'done' : (result.status === 'skipped' ? 'skipped' : 'error');
                                    engineProgress[idx].verdict = result.verdict;
                                    engineProgress[idx].confidence = result.confidence;
                                    engineProgress[idx].detail = result.detail || '';
                                    engineProgress[idx].time = (result.responseTime / 1000).toFixed(1) + 's';
                                }
                            }
                        }

                        // 最终结果
                        detectResult.value = {
                            filename: d.fileName, filesize: d.fileSize,
                            hash: d.hashes?.sha256 || d.hashes?.md5 || '',
                            verdict: d.decision?.verdict || 'clean',
                            confidence: d.decision?.confidence || 0,
                            primaryEngine: d.decision?.primaryEngine || '',
                            recommendation: d.decision?.recommendation || '',
                            scanId: d.scanId,
                            totalTime: d.totalTime || 0,
                            report: d.report
                        };

                        // 添加到历史记录
                        records.value.unshift({
                            id: 'VIR-' + d.recordId, filename: d.fileName, filesize: d.fileSize || 0,
                            hash: d.hashes?.md5 || '', verdict: detectResult.value.verdict,
                            source: d.decision?.primaryEngine || '多引擎',
                            confidence: (detectResult.value.confidence * 100).toFixed(1),
                            time: new Date().toLocaleString('zh-CN'),
                            scanId: d.scanId
                        });
                    }
                } catch(e) {
                    engineProgress.forEach(ep => { ep.status = 'error'; ep.detail = '调用失败'; });
                    ElementPlus.ElMessage.error('扫描失败: ' + (e.response?.data?.message || e.message));
                }
                detecting.value = false; uploading.value = false;
            }

                        showReportDialog.value = true;

            function formatSize(bytes) { return bytes < 1024 ? bytes + ' B' : (bytes / 1024).toFixed(1) + ' KB'; }

            return { loading, uploading, detecting, detectResult, records, pagination, paginatedRecords, fileList, handleUpload, getConclusionInfo, getConclusionTag, formatSize, engineProgress, engineResults, showReportDialog, reportContent, viewReport, downloadReport };
        },
        template: `

            <div class="page-header"><div><div class="page-title">病毒查杀 - 多引擎协同检测</div><div class="page-desc">本地哈希 + 360天眼 + 卡巴斯基 + AI恶意检测 + AI投毒检测</div></div></div>

                            <span v-if="eng.status==='scanning'" style="color:#e6a23c;"><el-icon class="is-loading"><Loading /></el-icon></span>
                            <span v-else-if="eng.status==='done'" style="color:#67c23a;">&#10004;</span>

    // AI ASSISTANT PAGE
    // ============================================
    app.component('assistant-page', defineComponent({
        setup() {
            const conversationId = ref('default');
            const messages = ref([]);
            const inputMessage = ref('');
            const loading = ref(false);
            const showHistory = ref(false);
            
            // 初始化欢迎消息
            onMounted(() => {
                messages.value = [
                    {
                        role: 'assistant',
                        content: '👋 您好！我是玄鉴安全智能体，基于DeepSeek V4 Pro驱动的AI安全助手。\n\n我可以帮助您：\n\n📊 **报告生成**\n- 生成每日/每周/每月安全报告\n- 生成扫描报告和基线检查报告\n\n **威胁情报查询**\n- 查询IP、域名、哈希等威胁指标\n- 分析恶意软件哈希\n\n⚠️ **告警分析**\n- 查看和筛选安全告警\n- 深度分析告警数据\n\n🔧 **系统操作**\n- 检查系统健康状态\n- 管理对话历史\n\n💬 您可以直接输入问题或使用命令与我交流。输入"help"查看所有可用命令。'
                    }
                ];
                loadHistory();
            });
            
            async function loadHistory() {
                try {
                    const res = await axios.get(`${API_BASE}/ai/history/${conversationId.value}`, { headers: getAuthHeader() });
                    if (res.data.code === 0 && res.data.data.messages.length > 0) {
                        messages.value = res.data.data.messages;
                    }
                } catch (err) {
                    console.error('加载历史记录失败:', err);
                }
            }
            
            async function sendMessage() {
                if (!inputMessage.value.trim() || loading.value) return;
                
                const userMsg = inputMessage.value.trim();
                messages.value.push({ role: 'user', content: userMsg });
                inputMessage.value = '';
                loading.value = true;
                
                try {
                    const res = await axios.post(`${API_BASE}/ai/chat`, {
                        message: userMsg,
                        conversation_id: conversationId.value
                    }, { headers: getAuthHeader(), timeout: 120000 });
                    
                    if (res.data.code === 0) {
                        messages.value.push({
                            role: 'assistant',
                            content: res.data.data.content,
                            is_report: res.data.data.is_report
                        });
                    } else {
                        messages.value.push({
                            role: 'assistant',
                            content: '❌ 处理失败：' + (res.data.message || '未知错误')
                        });
                    }
                } catch (err) {
                    let errorMsg = '❌ 网络错误，请稍后重试';
                    if (err.response) {
                        if (err.response.status === 401) {
                            errorMsg = '❌ 登录已过期，请重新登录';
                            setTimeout(() => { window.location.href = 'login.html'; }, 2000);
                        } else if (err.response.status === 403) {
                            errorMsg = '❌ 权限不足，无法访问';
                        } else if (err.response.status === 500) {
                            errorMsg = ' 服务器内部错误';
                        } else {
                            errorMsg = `❌ 请求失败 (${err.response.status})`;
                        }
                    } else if (err.code === 'ECONNABORTED') {
                        errorMsg = '❌ 请求超时，AI正在处理中，请稍后重试';
                    } else if (err.request) {
                        errorMsg = '❌ 无法连接到服务器，请检查网络';
                    } else {
                        errorMsg = ' 请求异常: ' + err.message;
                    }
                    console.error('AI聊天错误:', err);
                    messages.value.push({
                        role: 'assistant',
                        content: errorMsg
                    });
                } finally {
                    loading.value = false;
                }
            }
            
            async function clearHistory() {
                try {
                    await axios.delete(`${API_BASE}/ai/history/${conversationId.value}`, { headers: getAuthHeader() });
                    messages.value = [{
                        role: 'assistant',
                        content: '✅ 对话历史已清除。我现在是全新的状态，可以重新开始对话。'
                    }];
                } catch (err) {
                    console.error('清除历史失败:', err);
                }
            }
            
            function handleKeyDown(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            }
            
            return {
                messages,
                inputMessage,
                loading,
                showHistory,
                sendMessage,
                clearHistory,
                handleKeyDown,
                conversationId
            };
        },
        template: `
            <div class="assistant-page">
                <div class="page-header">
                    <div>
                        <div class="page-title">AI安全助手</div>
                        <div class="page-desc">智能对话 · 报告生成 · 威胁分析 · 告警查询</div>
                    </div>
                    <el-button @click="clearHistory" type="danger" plain size="small">
                        <el-icon><Delete /></el-icon> 清除对话
                    </el-button>
                </div>
                
                <div class="assistant-container">
                    <div class="chat-messages" ref="chatContainer">
                        <div v-for="(msg, idx) in messages" :key="idx" 
                             :class="['message', msg.role === 'user' ? 'user-message' : 'assistant-message']">
                            <div class="message-avatar">
                                <el-icon v-if="msg.role === 'user'" size="24"><User /></el-icon>
                                <el-icon v-else size="24"><ChatDotRound /></el-icon>
                            </div>
                            <div class="message-content">
                                <div class="message-bubble" v-html="formatContent(msg.content)"></div>
                            </div>
                        </div>
                        <div v-if="loading" class="message assistant-message">
                            <div class="message-avatar">
                                <el-icon size="24"><ChatDotRound /></el-icon>
                            </div>
                            <div class="message-content">
                                <div class="message-bubble loading">
                                    <span class="loading-dot"></span>
                                    <span class="loading-dot"></span>
                                    <span class="loading-dot"></span>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="chat-input">
                        <el-input
                            v-model="inputMessage"
                            type="textarea"
                            :rows="2"
                            placeholder="输入消息，Enter发送，Shift+Enter换行..."
                            @keydown="handleKeyDown"
                            :disabled="loading"
                        />
                        <el-button type="primary" @click="sendMessage" :loading="loading" :disabled="!inputMessage.trim()">
                            <el-icon><Promotion /></el-icon> 发送
                        </el-button>
                    </div>
                </div>
            </div>
        `,
        methods: {
            formatContent(content) {
                if (!content) return '';
                return content
                    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                    .replace(/\n/g, '<br>')
                    .replace(/`([^`]+)`/g, '<code style="background: rgba(0,212,255,0.1);padding:2px 6px;border-radius:4px;">$1</code>');
            }
        }
    }));

    app.component('djpp-page', defineComponent({
        setup() {
            const levels = ref([]);
            const tasks = ref([]);
            const reports = ref([]);
            const selectedLevel = ref(null);
            const taskName = ref('');
            const taskDescription = ref('');
            const loading = ref(false);
            const currentTask = ref(null);
            const currentReport = ref(null);
            const activeTab = ref('tasks');
            const generatingReport = ref(false);
            
            onMounted(async () => {
                await loadLevels();
                await loadTasks();
                await loadReports();
            });
            
            async function loadLevels() {
                try {
                    const res = await axios.get(`${API_BASE}/djpp/levels`, { headers: getAuthHeader() });
                    if (res.data.code === 0) {
                        levels.value = res.data.data;
                    }
                } catch (err) {
                    console.error('加载等保级别失败:', err);
                }
            }
            
            async function loadTasks() {
                try {
                    const res = await axios.get(`${API_BASE}/djpp/tasks`, { headers: getAuthHeader() });
                    if (res.data.code === 0) {
                        tasks.value = res.data.data.tasks || [];
                    }
                } catch (err) {
                    console.error('加载任务列表失败:', err);
                }
            }
            
            async function loadReports() {
                try {
                    const res = await axios.get(`${API_BASE}/djpp/reports`, { headers: getAuthHeader() });
                    if (res.data.code === 0) {
                        reports.value = res.data.data.reports || [];
                    }
                } catch (err) {
                    console.error('加载报告列表失败:', err);
                }
            }
            
            async function startTask() {
                if (!selectedLevel.value || !taskName.value) {
                    return alert('请选择测评级别并填写任务名称');
                }
                
                loading.value = true;
                try {
                    const res = await axios.post(`${API_BASE}/djpp/tasks`, {
                        level: selectedLevel.value,
                        name: taskName.value,
                        description: taskDescription.value
                    }, { headers: getAuthHeader() });
                    
                    if (res.data.code === 0) {
                        alert('测评任务已创建，正在执行...');
                        await loadTasks();
                        taskName.value = '';
                        taskDescription.value = '';
                        
                        // 等待一段时间后刷新任务状态
                        setTimeout(() => loadTasks(), 5000);
                    }
                } catch (err) {
                    console.error('创建任务失败:', err);
                    alert('创建任务失败');
                } finally {
                    loading.value = false;
                }
            }
            
            async function viewTask(taskId) {
                try {
                    const res = await axios.get(`${API_BASE}/djpp/tasks/${taskId}`, { headers: getAuthHeader() });
                    if (res.data.code === 0) {
                        currentTask.value = res.data.data;
                    }
                } catch (err) {
                    console.error('加载任务详情失败:', err);
                }
            }
            
            async function generateReport(taskId) {
                generatingReport.value = true;
                try {
                    const res = await axios.post(`${API_BASE}/djpp/tasks/${taskId}/report`, {}, { headers: getAuthHeader() });
                    if (res.data.code === 0) {
                        currentReport.value = res.data.data;
                        alert('报告生成成功！');
                        await loadReports();
                    }
                } catch (err) {
                    console.error('生成报告失败:', err);
                    alert('报告生成失败');
                } finally {
                    generatingReport.value = false;
                }
            }
            
            async function deleteReport(reportId) {
                if (!confirm('确定要删除此报告吗？')) return;
                
                try {
                    const res = await axios.delete(`${API_BASE}/djpp/reports/${reportId}`, { headers: getAuthHeader() });
                    if (res.data.code === 0) {
                        alert('删除成功');
                        await loadReports();
                    }
                } catch (err) {
                    console.error('删除报告失败:', err);
                    alert('删除失败');
                }
            }
            
            async function downloadMD() {
                if (!currentReport.value?.reportId) {
                    ElementPlus.ElMessage.warning('报告ID不存在，无法下载MD');
                    return;
                }
                try {
                    ElementPlus.ElMessage.info('正在生成MD报告...');
                    const res = await api.post(`/reports/${currentReport.value.reportId}/generate-md`, {}, { timeout: 30000 });
                    if (res && res.code === 0 && res.data && res.data.downloadUrl) {
                        const mdUrl = `${API_BASE}${res.data.downloadUrl}`;
                        window.open(mdUrl, '_blank');
                        ElementPlus.ElMessage.success('MD报告已开始下载');
                    } else {
                        ElementPlus.ElMessage.error('MD生成失败: ' + (res.data?.message || '未知错误'));
                    }
                } catch(e) {
                    console.error('MD下载失败:', e);
                    ElementPlus.ElMessage.error('MD下载失败: ' + (e.response?.data?.message || e.message));
                }
            }

            async function downloadDOCX() {
                if (!currentReport.value?.reportId) {
                    ElementPlus.ElMessage.warning('报告ID不存在，无法下载DOCX');
                    return;
                }
                try {
                    ElementPlus.ElMessage.info('正在生成DOCX报告，请稍候...');
                    const res = await api.post(`/reports/${currentReport.value.reportId}/generate-docx`, {}, { timeout: 60000 });
                    if (res && res.code === 0 && res.data && res.data.downloadUrl) {
                        const docxUrl = `${API_BASE}${res.data.downloadUrl}`;
                        window.open(docxUrl, '_blank');
                        ElementPlus.ElMessage.success('DOCX报告已开始下载');
                    } else {
                        ElementPlus.ElMessage.error('DOCX生成失败: ' + (res.data?.message || '未知错误'));
                    }
                } catch(e) {
                    console.error('DOCX下载失败:', e);
                    ElementPlus.ElMessage.error('DOCX下载失败: ' + (e.response?.data?.message || e.message));
                }
            }

            function downloadReport(report) {
                try {
                    const content = report?.content ? 
                        (typeof report.content === 'string' ? report.content : JSON.stringify(report.content)) : 
                        JSON.stringify(report);
                    
                    const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `${report?.title || '等保报告'}.txt`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                } catch (err) {
                    console.error('下载报告失败:', err);
                    alert('下载失败');
                }
            }

            function getStatusText(status) {
                switch (status) {
                    case 'pending': return '等待中';
                    case 'running': return '执行中';
                    case 'completed': return '已完成';
                    case 'failed': return '失败';
                    default: return status;
                }
            }
            
            return {
                levels,
                tasks,
                reports,
                selectedLevel,
                taskName,
                taskDescription,
                loading,
                currentTask,
                currentReport,
                activeTab,
                generatingReport,

                viewTask,
                generateReport,
                deleteReport,
                downloadReport,
                getStatusColor,
                getStatusText

    // DJPP (等保测评) PAGE
    // ============================================
    app.component('djpp-page', defineComponent({
        setup() {
            const loading = ref(true);
            const levels = ref([]);
            const tasks = ref([]);
            const selectedLevel = ref(3);
            const taskDetail = ref(null);
            const showTaskDetail = ref(false);
            const showReportDetail = ref(false);
            const currentReport = ref(null);
            const creatingTask = ref(false);
            const activeTab = ref('levels');

            const taskForm = reactive({
                level: 3,
                name: '',
                description: ''
            });

            async function loadLevels() {
                try {
                    const res = await api.get('/djpp/levels');
                    if (res && res.code === 0) {
                        levels.value = res.data;
                    }
                } catch(e) {
                    levels.value = [
                        { id: 1, level: 1, name: '第一级', description: '自主保护级' },
                        { id: 2, level: 2, name: '第二级', description: '指导保护级' },
                        { id: 3, level: 3, name: '第三级', description: '监督保护级' },
                        { id: 4, level: 4, name: '第四级', description: '强制保护级' },
                        { id: 5, level: 5, name: '第五级', description: '专控保护级' }
                    ];
                }
            }

            async function loadTasks() {
                loading.value = true;
                try {
                    const res = await api.get('/djpp/tasks?page=1&pageSize=50');
                    if (res && res.code === 0) {
                        tasks.value = (res.data.tasks || []).map(t => ({
                            ...t,
                            statusText: t.status === 'pending' ? '待执行' : (t.status === 'running' ? '执行中' : (t.status === 'completed' ? '已完成' : '失败')),
                            statusType: t.status === 'pending' ? 'warning' : (t.status === 'running' ? 'primary' : (t.status === 'completed' ? 'success' : 'danger'))
                        }));
                    }
                } catch(e) {
                    tasks.value = [];
                }
                loading.value = false;
            }

            async function startTask() {
                if (!taskForm.name) {
                    ElementPlus.ElMessage.warning('请输入任务名称');
                    return;
                }
                creatingTask.value = true;
                try {
                    const res = await api.post('/djpp/tasks', {
                        level: taskForm.level,
                        name: taskForm.name,
                        description: taskForm.description
                    });
                    if (res && res.code === 0) {
                        ElementPlus.ElMessage.success('测评任务已启动');
                        taskForm.name = '';
                        taskForm.description = '';
                        loadTasks();
                    }
                } catch(e) {
                    ElementPlus.ElMessage.error('任务创建失败');
                }
                creatingTask.value = false;
            }

            async function viewTask(taskId) {
                try {
                    const res = await api.get('/djpp/tasks/' + taskId);
                    if (res && res.code === 0) {
                        taskDetail.value = res.data;
                        showTaskDetail.value = true;
                    }
                } catch(e) {
                    ElementPlus.ElMessage.error('获取任务详情失败');
                }
            }

            const generatingReportId = ref(null);

            async function generateReport(taskId) {
                if (generatingReportId.value) {
                    ElementPlus.ElMessage.warning('报告正在生成中，请稍候...');
                    return;
                }
                generatingReportId.value = taskId;
                ElementPlus.ElMessage.info('正在调用AI生成测评报告，预计需要30-60秒，请耐心等待...');
                try {
                    const res = await api.post('/djpp/tasks/' + taskId + '/report', null, { timeout: 120000 });
                    if (res && res.code === 0 && res.data) {
                        currentReport.value = res.data;
                        showReportDetail.value = true;
                        ElementPlus.ElMessage.success('报告生成成功');
                        loadTasks();
                    } else {
                        ElementPlus.ElMessage.error('报告生成失败: ' + (res.message || '未知错误'));
                    }
                } catch(e) {
                    console.error('报告生成异常:', e);
                    const errMsg = e.response?.data?.message || e.message || '网络连接失败';
                    ElementPlus.ElMessage.error('报告生成失败: ' + errMsg);
                } finally {
                    generatingReportId.value = null;
                }
            }

            function downloadReport(report) {
                const content = report.aiAnalysis || report.content || '无内容';
                const blob = new Blob([`# ${report.taskName} - 等级保护${report.level}级测评报告\n\n${content}`], { type: 'text/markdown;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `等保${report.level}级测评报告_${report.taskId}.md`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                ElementPlus.ElMessage.success('报告已下载');
            }

            async function downloadReportDOCX() {
                if (!currentReport.value?.reportId) {
                    ElementPlus.ElMessage.warning('报告ID不存在，无法下载DOCX');
                    return;
                }
                try {
                    ElementPlus.ElMessage.info('正在生成DOCX报告，请稍候...');
                    const res = await api.post(`/reports/${currentReport.value.reportId}/generate-docx`, {}, { timeout: 60000 });
                    if (res && res.code === 0 && res.data && res.data.downloadUrl) {
                        const docxUrl = `${API_BASE}${res.data.downloadUrl}`;
                        window.open(docxUrl, '_blank');
                        ElementPlus.ElMessage.success('DOCX报告已开始下载');
                    } else {
                        ElementPlus.ElMessage.error('DOCX生成失败: ' + (res.data?.message || '未知错误'));
                    }
                } catch(e) {
                    console.error('DOCX下载失败:', e);
                    ElementPlus.ElMessage.error('DOCX下载失败: ' + (e.response?.data?.message || e.message));
                }
            }

            onMounted(() => {
                loadLevels();
                loadTasks();
            });

            return {
                loading, levels, tasks, selectedLevel, taskDetail, showTaskDetail,
                showReportDetail, currentReport, creatingTask, activeTab, taskForm, generatingReportId,
                loadLevels, loadTasks, startTask, viewTask, generateReport, downloadReport, downloadReportDOCX
            };
        },
        template: `

    app.component('reports-page', defineComponent({
        setup() {
            const loading = ref(true);
            const reports = ref([]);
            const reportDetail = ref(null);
            const showDetail = ref(false);
            const activeTab = ref('all');
            const reportStats = ref({ total: 0, djpp: 0, virus: 0, baseline: 0, scan: 0 });
            const generatingPDF = ref(false);

            async function loadReportStats() {
                try {
                    const res = await api.get('/reports/stats', { headers: getAuthHeader() });
                    if (res && res.data && res.data.code === 0) {
                        reportStats.value = res.data.data;
                    }
                } catch(e) {
                    console.error('获取报告统计失败:', e);
                }
            }

            async function loadReports() {
                loading.value = true;
                try {
                    let url = '/reports/list?page=1&pageSize=100';
                    if (activeTab.value !== 'all') {
                        url += `&type=${activeTab.value}`;
                    }
                    const res = await api.get(url, { headers: getAuthHeader() });
                    if (res && res.data && res.data.code === 0) {
                        reports.value = (res.data.data.reports || []).map(r => ({
                            id: r.id, 
                            reportId: r.reportId,
                            title: r.title || '未命名报告',
                            type: r.type,
                            typeLabel: r.typeLabel || r.type,
                            content: r.content || (typeof r.content === 'string' ? r.content : ''), 
                            generatedBy: r.generatedBy || '-',
                            generatedAt: r.generatedAt ? new Date(r.generatedAt).toLocaleString('zh-CN') : '-',
                            stats: r.stats || null,
                            hasPDF: r.hasPDF || false,
                            pdfUrl: r.pdfUrl || null
                        }));
                    }
                } catch(e) {
                    console.error('获取报告列表失败:', e);
                    ElementPlus.ElMessage.error('获取报告列表失败');
                    reports.value = [];
                }
                loading.value = false;
            }

            function viewReport(report) {
                reportDetail.value = report;
                showDetail.value = true;
            }

            function downloadMarkdownReport(report) {
                const content = report.content || '无内容';
                const blob = new Blob([`# ${report.title}\n\n生成时间: ${report.generatedAt}\n生成者: ${report.generatedBy}\n\n${content}`], { type: 'text/markdown;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url; a.download = report.title + '.md';
                document.body.appendChild(a); a.click();
                document.body.removeChild(a); URL.revokeObjectURL(url);
                ElementPlus.ElMessage.success('Markdown报告已下载');
            }

            async function generateAndDownloadDOCX(report) {
                try {
                    generatingPDF.value = true;
                    ElementPlus.ElMessage.info('正在生成DOCX报告，请稍候...');
                    
                    const res = await api.post(`/reports/${report.id}/generate-docx`, {}, { headers: getAuthHeader() });
                    if (res && res.data && res.data.code === 0) {
                        const docxUrl = res.data.data.downloadUrl;
                        const fullUrl = `${API_BASE}${docxUrl}`;
                        
                        window.open(fullUrl, '_blank');
                        ElementPlus.ElMessage.success('DOCX报告已下载');
                        report.hasDOCX = true;
                    } else {
                        ElementPlus.ElMessage.error(res.data.message || 'DOCX生成失败');
                    }
                } catch(e) {
                    console.error('DOCX报告生成失败:', e);
                    ElementPlus.ElMessage.error('DOCX报告生成失败: ' + (e.message || '网络错误'));
                } finally {
                    generatingPDF.value = false;
                }
            }

            async function deleteReport(report) {
                try {
                    await ElementPlus.ElMessageBox.confirm('确定要删除此报告吗？', '确认删除', { type: 'warning' });
                    const res = await api.delete(`/reports/${report.id}`, { headers: getAuthHeader() });
                    if (res && res.data && res.data.code === 0) {
                        ElementPlus.ElMessage.success('报告已删除');
                        loadReports();
                        loadReportStats();
                    } else {
                        ElementPlus.ElMessage.error(res.data.message || '删除失败');
                    }
                } catch(e) {
                    if (e !== 'cancel') {
                        console.error('删除报告失败:', e);
                    }
                }
            }

            watch(activeTab, () => {
                loadReports();
            });

            onMounted(() => { 
                loadReports(); 
                loadReportStats();
            });

            return { 
                loading, reports, reportDetail, showDetail, activeTab, reportStats, generatingPDF,
                viewReport, downloadMarkdownReport, generateAndDownloadDOCX, deleteReport, loadReports, loadReportStats 
            };
        },
        template: `

        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
            <h2 style="color:#00d4ff;margin:0;">报告管理</h2>
            <el-button type="primary" @click="loadReports(); loadReportStats();" :icon="RefreshRight">刷新</el-button>
        </div>

        <el-row :gutter="20" style="margin-bottom:20px;">
            <el-col :span="6">
                <el-card shadow="hover" style="background:rgba(26,26,46,0.6);border-color:#333;">

                        <div style="font-size:32px;color:#00d4ff;font-weight:bold;">{{ reportStats.total || 0 }}</div>
                        <div style="font-size:14px;color:#999;margin-top:5px;">总报告数</div>
                    </div>
                </el-card>
            </el-col>
            <el-col :span="6">
                <el-card shadow="hover" style="background:rgba(26,26,46,0.6);border-color:#333;">
                    <div style="text-align:center;">
                        <div style="font-size:32px;color:#e74c3c;font-weight:bold;">{{ reportStats.djpp || 0 }}</div>
                        <div style="font-size:14px;color:#999;margin-top:5px;">等保测评报告</div>
                    </div>
                </el-card>
